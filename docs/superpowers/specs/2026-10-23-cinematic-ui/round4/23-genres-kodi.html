<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaFlix · Cinematic · Genres</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=block" rel="stylesheet">
<link rel="stylesheet" href="../round3/shared.css"><link rel="stylesheet" href="cinematic.css">
<style>
.head{position:absolute;left:var(--x);right:96px;top:56px;display:flex;align-items:center;gap:22px}
.head h1{font-family:var(--serif);font-size:64px;font-weight:700}
.head .tabs{margin-left:auto;display:flex;gap:10px}
.head .tab{height:48px;padding:0 24px;border-radius:24px;display:flex;align-items:center;font-size:20px;font-weight:600;background:var(--s2);color:var(--ink2)}
.head .tab.on{background:var(--ink);color:var(--bg)}
.grid{position:absolute;left:var(--x);top:180px;right:96px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
/* each genre: a picture from its own list, the name set large over it */
.g{height:196px;border-radius:var(--r);overflow:hidden;position:relative;transition:transform .2s}
.g img{width:100%;height:100%;object-fit:cover}
.g .sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,10,.85) 0,rgba(5,7,10,.35) 60%,rgba(5,7,10,.1) 100%)}
.g b{position:absolute;left:22px;bottom:18px;font-family:var(--serif);font-size:36px;font-weight:700}
.g span{position:absolute;left:24px;top:18px;font-size:16px;font-weight:600;color:var(--ink2)}
.g.f{transform:scale(1.04);box-shadow:0 0 0 3px var(--ink),0 18px 40px rgba(0,0,0,.6);z-index:2}

/* Kodi build: the skin font (bold sans) replaces the serif */
.title,h1,.g b,.t{font-family:"Noto Sans",sans-serif!important;letter-spacing:-.01em!important}
.g b{font-size:34px;font-weight:700}
.head .count{font-size:20px;color:var(--ink3);margin-left:6px}
.head h1{font-size:56px}
</style></head><body>
<div id="stage">
  <nav class="rail"><img class="mark" src="../icons/av-logo.png" alt="NovaFlix">
    <ul><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-home.png)"></span></li><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-search.png)"></span></li><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-play_circle.png)"></span></li><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-bookmark.png)"></span></li><li class="on"><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-explore.png)"></span></li></ul>
    <ul class="end"><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-settings.png)"></span></li></ul></nav>
  <header class="head"><h1>Genres</h1><span class="count">Films and shows</span></header>
  <section class="grid">
    <div class="g" tabindex="0"><img src="../img/001-volcano-eruption-of-litli-hrutur-in.jpg" alt=""><div class="sh"></div><span>Films</span><b>Drama</b></div>
    <div class="g" tabindex="0"><img src="../img/d4342b-grand-canyon-scenic-sunset-from-desert.jpg" alt=""><div class="sh"></div><span>Films</span><b>Family</b></div>
    <div class="g" tabindex="0"><img src="../img/melies-trip-to-the-moon-cannon-still.jpg" alt=""><div class="sh"></div><span>Films</span><b>Fantasy</b></div>
    <div class="g" tabindex="0"><img src="../img/neon-night-3-23358201426.jpg" alt=""><div class="sh"></div><span>Films</span><b>History</b></div>
    <div class="g" tabindex="0"><img src="../img/la-horde-surfers-riding-a-wave-in.jpg" alt=""><div class="sh"></div><span>Films</span><b>Horror</b></div>
    <div class="g" tabindex="0"><img src="../img/charade-1963-audrey-hepburn-and-cary-grant.jpg" alt="" style="object-position:60% 20%"><div class="sh"></div><span>Films</span><b>Mystery</b></div>
    <div class="g" tabindex="0"><img src="../img/vista-s-infrared-view-of-the-lagoon.jpg" alt=""><div class="sh"></div><span>Films</span><b>Romance</b></div>
    <div class="g" tabindex="0"><img src="../img/metropolis-1927-us-lobby-card.jpg" alt=""><div class="sh"></div><span>Films</span><b>Science Fiction</b></div>
    <div class="g" tabindex="0"><img src="../img/max-schreck-as-count-orlok-in-nosferatu.jpg" alt="" style="object-position:50% 25%"><div class="sh"></div><span>Films</span><b>Thriller</b></div>
    <div class="g" tabindex="0"><img src="../img/039-northern-lights-over-myvatn-iceland-photo.jpg" alt=""><div class="sh"></div><span>Films</span><b>War</b></div>
    <div class="g" tabindex="0"><img src="../img/charade-1963-audrey-hepburn-and-cary-grant.jpg" alt="" style="object-position:80% 30%"><div class="sh"></div><span>Films</span><b>Western</b></div>
    <div class="g f" tabindex="0" data-start"><img src="../img/flaming-star-nebula-ic-405.png" alt=""><div class="sh"></div><span>Shows</span><b>Action & Adventure</b></div>
    <div class="g" tabindex="0"><img src="../img/buildings-with-colorful-neon-street-signs-at.jpg" alt=""><div class="sh"></div><span>Shows</span><b>Comedy</b></div>
    <div class="g" tabindex="0"><img src="../img/metropolis-1927-hel.jpg" alt=""><div class="sh"></div><span>Shows</span><b>Crime</b></div>
    <div class="g" tabindex="0"><img src="../img/d4342b-grand-canyon-scenic-sunset-from-desert.jpg" alt="" style="object-position:20% 70%"><div class="sh"></div><span>Shows</span><b>Documentary</b></div>
    <div class="g" tabindex="0"><img src="../img/melies-trip-to-the-moon-cannon-still.jpg" alt="" style="object-position:30% 30%"><div class="sh"></div><span>Shows</span><b>Drama</b></div>
  </section>
</div>
<script src="../round3/shared.js"></script>
</body></html>
