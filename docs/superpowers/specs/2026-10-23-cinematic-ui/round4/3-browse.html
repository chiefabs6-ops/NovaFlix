<title>NovaFlix · Cinematic · Browse</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=block" rel="stylesheet">
<link rel="stylesheet" href="../round3/shared.css"><link rel="stylesheet" href="cinematic.css">
<style>
/* the focused title's artwork fills the top, faded more than on Home */
.art{height:640px}
.art img{object-position:65% 20%}
.art .v{background:linear-gradient(90deg,var(--bg) 0,rgba(5,7,10,.85) 30%,rgba(5,7,10,.25) 70%,rgba(5,7,10,.4) 100%),linear-gradient(0deg,var(--bg) 0,rgba(5,7,10,.4) 50%,rgba(5,7,10,.2) 100%)}
.head{position:absolute;left:var(--x);right:96px;top:52px;display:flex;align-items:baseline;gap:18px;z-index:2}
.head h1{font-size:34px;font-weight:700}
.head span{font-size:20px;color:var(--ink3)}
.head .sort{margin-left:auto;font-size:20px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.12);border-radius:22px;padding:8px 20px}
.peek{position:absolute;left:var(--x);top:170px;width:780px;z-index:2}
.peek .title{font-size:76px}
.peek .meta{margin-top:18px}
.peek .plot{margin-top:16px;font-size:21px;width:640px}
.grid{position:absolute;left:var(--x);top:520px;right:0;display:grid;grid-template-columns:repeat(8,180px);gap:36px 22px;z-index:2}
.grid img{width:180px;height:270px}
.grid img.f{transform:scale(1.07)}
.grid .lbl{display:none}
</style></head><body>

    <ul class="end"><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-settings.png)"></span></li></ul></nav>
