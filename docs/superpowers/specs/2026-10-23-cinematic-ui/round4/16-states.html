<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaFlix · Cinematic · Loading, empty, offline</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=block" rel="stylesheet">
<link rel="stylesheet" href="../round3/shared.css"><link rel="stylesheet" href="cinematic.css">
<style>
.state{display:none}
/* loading: the page's own shapes, softly pulsing, so nothing jumps when it fills */
.sk{background:var(--s2);border-radius:8px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
#loading .glow{position:absolute;inset:0;background:radial-gradient(80% 70% at 75% 30%,#0f151d 0,var(--bg) 70%)}
#loading .a{position:absolute;left:var(--x);top:224px;width:200px;height:22px}
#loading .b{position:absolute;left:var(--x);top:270px;width:560px;height:96px;border-radius:12px}
#loading .c{position:absolute;left:var(--x);top:396px;width:460px;height:24px}
#loading .d{position:absolute;left:var(--x);top:446px;width:620px;height:20px}
#loading .e{position:absolute;left:var(--x);top:478px;width:540px;height:20px}
#loading .f1{position:absolute;left:var(--x);top:540px;width:170px;height:66px;border-radius:33px}
#loading .f2{position:absolute;left:calc(var(--x) + 186px);top:540px;width:200px;height:66px;border-radius:33px}
#loading .row{position:absolute;left:var(--x);top:700px;display:flex;gap:20px}
#loading .row .h{position:absolute;top:-44px;width:240px;height:24px}
#loading .row .sk.card{width:420px;height:236px;border-radius:var(--r)}
#loading .lab{position:absolute;right:96px;bottom:64px;display:flex;align-items:center;gap:14px;font-size:20px;color:var(--ink3)}
#loading .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--cyan);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* empty and offline: one sentence, one way forward, centred in the page */
.msg{position:absolute;left:var(--x);right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.msg .ring{width:116px;height:116px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--ink3)}
.msg .ring .ico{width:52px;height:52px}
.msg h1{font-family:var(--serif);font-size:60px;font-weight:700;margin-top:34px}
.msg p{font-size:23px;color:var(--ink2);margin-top:14px;max-width:720px;line-height:1.55}
.msg .btns{margin-top:36px;justify-content:center}
.head{position:absolute;left:var(--x);top:56px;display:flex;align-items:baseline;gap:18px}
.head h2{font-size:34px;font-weight:700}
.head span{font-size:20px;color:var(--ink3)}
</style></head><body>
<div id="stage">
  <nav class="rail"><img class="mark" src="../icons/av-logo.png" alt="NovaFlix">
    <ul><li id="r-home" class="on"><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-home.png)"></span></li><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-search.png)"></span></li><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-play_circle.png)"></span></li><li id="r-list"><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-bookmark.png)"></span></li><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-explore.png)"></span></li></ul>
    <ul class="end"><li><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-settings.png)"></span></li></ul></nav>

  <section class="state" id="loading">
    <div class="glow"></div>
    <div class="sk a"></div><div class="sk b"></div><div class="sk c"></div><div class="sk d"></div><div class="sk e"></div><div class="sk f1"></div><div class="sk f2"></div>
    <div class="row"><div class="sk h"></div><div class="sk card"></div><div class="sk card"></div><div class="sk card"></div><div class="sk card"></div></div>
    <div class="lab"><span class="spin"></span>Loading</div>
  </section>

  <section class="state" id="empty">
    <header class="head"><h2>My List</h2><span>0 titles</span></header>
    <div class="msg">
      <div class="ring"><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-bookmark.png)"></span></div>
      <h1>Nothing here yet</h1>
      <p>Hold OK on any film or show and choose Add to My List. It will wait for you here.</p>
      <div class="btns"><div class="btn play f" tabindex="0" data-start>Browse Trending Now</div></div>
    </div>
  </section>

  <section class="state" id="offline">
    <div class="msg">
      <div class="ring"><span class="ico" style="-webkit-mask-image:url(../icons/av-icon-cancel.png)"></span></div>
      <h1>Couldn’t load</h1>
      <p>No connection. Check your internet and try again.</p>
      <div class="btns"><div class="btn play f" tabindex="0" data-start>Retry</div></div>
    </div>
  </section>
</div>
<script>
// ?loading (default), ?empty or ?offline picks the state.
var m = (location.search.match(/empty|offline/) || ['loading'])[0];
document.getElementById(m).style.display = 'block';
if (m === 'empty') { document.getElementById('r-home').classList.remove('on'); document.getElementById('r-list').classList.add('on'); }
</script>
<script src="../round3/shared.js"></script>
</body></html>
